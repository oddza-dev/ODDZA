name: Deploy ODDZA Website to Firebase

'on':
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

concurrency:
group: oddza-firebase-hosting-deploy
cancel-in-progress: false

jobs:
deploy:
name: Deploy ODDZA website
runs-on: ubuntu-latest

steps:
  - name: Checkout website repository
    uses: actions/checkout@v4

  - name: Check required files
    run: |
      set -eu
      test -f firebase.json
      test -f index.html
      node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); console.log('firebase.json is valid JSON')"

  - name: Set up Firebase authentication
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    run: |
      set -eu
      if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
        echo "FIREBASE_SERVICE_ACCOUNT secret is missing."
        exit 1
      fi
      printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
      echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

  - name: Install Firebase CLI
    run: npm install --global firebase-tools

  - name: Deploy ODDZA Hosting only
    run: firebase deploy --only hosting:oddzatips --project bm-surescore --non-interactive

  - name: Confirm deployment
    run: echo "Deployment completed: https://oddzatips.web.app/"
